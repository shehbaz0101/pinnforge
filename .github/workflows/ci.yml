name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # Schemas, samplers, experiment configs, and the HTTP catalog do
          # not need torch. Residual, training, eval, and run tests are
          # marked ml and run in the cpu-torch job. The api extra installs
          # FastAPI for TestClient tests.
          python -m pip install -e ".[dev,api]"
      - name: Unit tests
        run: python -m pytest -m "not ml"

  cpu-torch:
    name: training, residual, and eval tests (CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,api]"
      - name: Unit tests including training, eval, and run
        run: python -m pytest

  demo-smoke:
    name: burgers inverse demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[api]"
      - name: Run the published inverse demo
        run: pinnforge demo burgers-inverse --output runs/burgers-inverse
      - name: Check the demo wrote a finite result
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("runs/burgers-inverse/result.json").read_text(encoding="utf-8"))
          assert record["format"] == "pinnforge.burgers_inverse_demo.v1"
          assert record["config"]["n_sensors"] == 32
          assert record["aggregates"]["closed_form"]["n"] == 4
          for name in ("closed_form", "operator", "baseline"):
              row = record["aggregates"][name]
              assert row["mean_rel_error"] == row["mean_rel_error"]
              assert row["mean_rel_error"] >= 0.0
          for name in ("viscosity_scatter.png", "relative_error.png", "field_sensors.png", "index.html", "result.md"):
              path = Path("runs/burgers-inverse") / name
              assert path.is_file() and path.stat().st_size > 0
          assert Path("runs/burgers-inverse/viscosity_scatter.png").read_bytes().startswith(b"\x89PNG")
          PY

  claims:
    name: claim-to-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Check claims
        run: python -m pinnforge.claims check

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: Ruff check
        run: python -m ruff check .
