[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnforge"
version = "0.1.0"
description = "Physics-informed neural network sandbox for classic ODE and PDE residuals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shehbaz Pathan" }]
keywords = ["pinn", "scientific-ml", "physics-informed", "scientific-computing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# httpx is what FastAPI's TestClient imports. Serving does not need it.
dev = ["pytest>=8.3", "httpx>=0.27,<1"]
# Day 3 MLP and residuals, the Day 4 training loop, and Day 5 evaluation.
# Default CI does not install this extra. A separate job installs a CPU
# torch wheel and runs the ml-marked tests.
ml = ["torch>=2.2,<3"]
# Day 7 localhost API. Not imported by the package root. CI installs this
# extra for the unit tests. Train, eval, and run routes still need ml.
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
# Optional. CI runs `ruff check` with the selection below. Not required to
# import or run PINNForge.
lint = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/shehbaz0101/pinnforge"
Repository = "https://github.com/shehbaz0101/pinnforge"

[project.scripts]
pinnforge = "pinnforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Bug-finding checks plus import order. E501 is omitted so later days are not
# restyled for line length. `ruff check` in CI uses this selection.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "ml: tests that import torch (optional extra). Default CI runs pytest -m \"not ml\".",
]
