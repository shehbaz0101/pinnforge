[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnforge"
version = "0.1.0"
description = "Physics-informed neural network sandbox for classic ODE and PDE residuals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shehbaz Pathan" }]
keywords = ["pinn", "scientific-ml", "physics-informed", "scientific-computing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
# Day 3+ MLP and training. Tests do not import torch, and CI does not
# install this extra (the default wheel is large and the sampler does not need it).
ml = ["torch>=2.2,<3"]
# Optional. CI runs `ruff check` with the selection below. Not required to
# import or run PINNForge.
lint = ["ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/shehbaz0101/pinnforge"
Repository = "https://github.com/shehbaz0101/pinnforge"

[project.scripts]
pinnforge = "pinnforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Bug-finding checks plus import order. E501 is omitted so later days are not
# restyled for line length. `ruff check` in CI uses this selection.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
