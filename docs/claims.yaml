  # README (Stage H). The hard_ood numbers are the strong-baseline record on
  # the Stage D sensors32_bursts mask. Integer tokens are registered with a
  # location so each one is anchored to the sentence that uses it.

  - id: readme-problem-statement-is-a-question
    class: superiority
    assertion:
      kind: not_a_ranking
      note: states the research question. The hard_ood table and the breakdown list answer it in both directions
    locations:
      - file: README.md
        pattern: "Measure when a learned operator beats running the solver, and when it doesn't"

  - id: readme-hard-ood-table
    class: comparison
    locations:
      - file: README.md
        pattern: '\| closed-form residual least squares \| sensors \| 0\.349 \| 9 \|'
      - file: README.md
        pattern: '\| weak-form identifier \| sensors \| 0\.090 \| 0 \|'
      - file: README.md
        pattern: '\| FNO, data loss \| sensors \| 0\.049 \| 0 \|'
      - file: README.md
        pattern: '\| FNO, hybrid physics loss \(weight `1e-2`\) \| sensors \| 0\.034 \| 0 \|'
      - file: README.md
        pattern: '\| solver in the loop, sensor-lift initial condition \| sensors \| 0\.0138 \| 0 \|'
      - file: README.md
        pattern: '\| solver in the loop, oracle initial condition \(ceiling\) \| full field at `t = 0`, then sensors \| 0\.0025 \| 0 \|'
      - file: README.md
        pattern: 'Each row recovers `ν` on the 30 `hard_ood` test instances'
    numbers:
      - token: "0.349"
        files: [README.md]
        evidence: docs/research/strong_baselines_scores.json
