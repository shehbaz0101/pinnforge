# Claim registry for python -m pinnforge.claims check.
# A numeric token is the published text. scale multiplies the evidence before
# rounding. Paths use "/" so keys such as "0.0" stay intact.
# Lower mean relative error is the more accurate inverse method.

version: 1

stronger_baselines:
  evidence: docs/research/strong_baselines_scores.json
  fno_methods:
    - fno_hybrid_1e-2
    - fno_data_only
  methods:
    solver_oracle_ic: methods/solver_oracle_ic/slices/hard_ood/mean_rel_error
    solver_sensor_ic: methods/solver_sensor_ic/slices/hard_ood/mean_rel_error
    fno_hybrid_1e-2: fno/arms/hybrid_1e-2/slices/hard_ood/mean_rel_error
    fno_data_only: fno/arms/data_only/slices/hard_ood/mean_rel_error
    weak_form: methods/weak_form/slices/hard_ood/mean_rel_error
    closed_form_ls: methods/closed_form_ls/slices/hard_ood/mean_rel_error

scan:
  superiority:
    - README.md
    - docs/README.md
    - CHANGELOG.md
    - PROJECT_STATUS.md
    - docs/demo/result.md
    - docs/demo/index.html
    - docs/research/strong_baselines.md
    - docs/v02/*.md
    - STAGE1_REPORT.md
    - STAGE2_REPORT.md
    - STAGE3_REPORT.md
    - STAGE4_REPORT.md
    - STAGE5_REPORT.md
    - STAGE_A_REPORT.md
    - STAGE_B_REPORT.md
    - STAGE_C_REPORT.md
    - STAGE_D_REPORT.md
    - STAGE_E_REPORT.md
    - STAGE_F_REPORT.md
  numbers:
    - README.md
    - docs/README.md
    - CHANGELOG.md
    - PROJECT_STATUS.md
    - docs/demo/result.md
    - docs/demo/index.html
    - docs/v02/*.md
  number_ignore:
    - 'Python 3\.\d+'
    - '\b3\.1[12]\b'
    - '127\.0\.0\.1'
    - '0\.0\.0\.0'
    - 'v0\.\d+\.\d+'
    - '(?<![0-9])0\.\d+\.\d+'
    - 'NumPy \d+\.\d+\.\d+'
    - 'torch \d+\.\d+\.\d+\+cpu'

leaf_documents:
  - file: docs/research/strong_baselines.md
    evidence:
      - docs/research/strong_baselines_scores.json
      - docs/research/strong_baselines_protocol.json

